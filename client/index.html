<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS 1v1</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: white;
        font-family: monospace;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        background: white;
        border-radius: 50%;
      }
      #score {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 2px;
        background: rgba(0, 0, 0, 0.4);
        padding: 6px 18px;
        border-radius: 6px;
      }
      #score .me {
        color: #6cf;
      }
      #score .sep {
        opacity: 0.5;
      }
      #score .opp {
        color: #f86;
      }
      #status {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        opacity: 0.7;
      }
      #players {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.6;
        min-width: 140px;
      }
      #players .title {
        opacity: 0.6;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
      }
      #players .row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #players .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      #players .me .dot {
        background: #6cf;
      }
      #players .opp .dot {
        background: #f86;
      }
      #players .you {
        opacity: 0.6;
        font-size: 11px;
        margin-left: 4px;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-family: monospace;
        font-size: 16px;
        cursor: pointer;
        pointer-events: auto;
        text-align: center;
        line-height: 1.6;
      }
      #overlay.hidden {
        display: none;
      }
      #overlay .panel {
        background: rgba(20, 28, 36, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 24px 32px;
        border-radius: 8px;
        cursor: default;
      }
      #overlay .panel.clickable {
        cursor: pointer;
      }
      #overlay h1 {
        margin: 0 0 16px;
        font-size: 22px;
        letter-spacing: 2px;
      }
      #overlay input {
        font-family: inherit;
        font-size: 16px;
        padding: 8px 12px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.4);
        color: white;
        width: 220px;
        margin: 4px 0 14px;
      }
      #overlay input:focus {
        outline: none;
        border-color: #6cf;
      }
      #overlay button {
        font-family: inherit;
        font-size: 16px;
        padding: 8px 24px;
        border-radius: 4px;
        border: 0;
        background: #6cf;
        color: #001;
        font-weight: bold;
        cursor: pointer;
      }
      #overlay button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #overlay .help {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="score">
        <span class="me" id="score-me">0</span>
        <span class="sep">—</span>
        <span class="opp" id="score-opp">0</span>
      </div>
      <div id="status">connecting…</div>
      <div id="players">
        <div class="title">Players</div>
        <div id="player-list"></div>
      </div>
    </div>
    <div id="overlay">
      <div class="panel" id="overlay-panel">
        <div id="name-form">
          <h1>FPS 1v1</h1>
          <div>Enter your name</div>
          <input id="name-input" maxlength="16" autocomplete="off" placeholder="Player" />
          <br />
          <button id="join-btn">Join match</button>
          <div class="help">
            WASD move &middot; Shift sprint &middot; Space jump &middot; Ctrl crouch &middot; Mouse
            look
          </div>
        </div>
        <div id="play-text" style="display: none">
          Click to play
          <div class="help">
            WASD move &middot; Shift sprint &middot; Space jump &middot; Ctrl crouch &middot; ESC to
            release
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
