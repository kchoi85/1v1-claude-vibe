<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS 1v1</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: white;
        font-family: monospace;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        margin: -2.5px 0 0 -2.5px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
      }
      #hit-x::before,
      #hit-x::after {
        content: '';
        position: absolute;
        background: currentColor;
        left: 50%;
        top: 50%;
        transform-origin: center;
      }
      #hit-x {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        color: #ffffff;
        opacity: 0;
        transform: scale(0.7);
        transition:
          opacity 120ms ease,
          transform 120ms ease;
      }
      #hit-x.show {
        opacity: 1;
        transform: scale(1);
      }
      #hit-x::before {
        width: 28px;
        height: 3px;
        transform: translate(-50%, -50%) rotate(45deg);
      }
      #hit-x::after {
        width: 28px;
        height: 3px;
        transform: translate(-50%, -50%) rotate(-45deg);
      }
      #hurt-flash {
        position: absolute;
        inset: 0;
        border: 0 solid rgba(255, 42, 42, 0);
        box-shadow: inset 0 0 0 rgba(255, 0, 0, 0);
        opacity: 0;
        transition:
          opacity 180ms ease,
          border-width 180ms ease,
          box-shadow 180ms ease;
      }
      #hurt-flash.show {
        border-width: 14px;
        box-shadow: inset 0 0 44px rgba(255, 0, 0, 0.55);
        opacity: 1;
      }
      #score {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 42px;
        font-weight: bold;
        letter-spacing: 2px;
        background: rgba(0, 0, 0, 0.4);
        padding: 10px 28px;
        border-radius: 6px;
      }
      #score .me {
        color: #6cf;
      }
      #score .sep {
        opacity: 0.5;
      }
      #score .opp {
        color: #f86;
      }
      #status {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        opacity: 0.7;
      }
      #players {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.6;
        min-width: 140px;
      }
      #players .title {
        opacity: 0.6;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
      }
      #players .row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #players .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      #players .me .dot {
        background: #6cf;
      }
      #players .opp .dot {
        background: #f86;
      }
      #players .you {
        opacity: 0.6;
        font-size: 11px;
        margin-left: 4px;
      }
      #ammo {
        position: absolute;
        right: 22px;
        bottom: 20px;
        min-width: 128px;
        text-align: right;
        font-size: 34px;
        font-weight: bold;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
      }
      #ammo .label {
        display: block;
        font-size: 11px;
        opacity: 0.65;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      #hp-panel {
        position: absolute;
        left: 50%;
        bottom: 22px;
        width: min(420px, calc(100vw - 220px));
        transform: translateX(-50%);
      }
      #hp-panel .label-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 12px;
        opacity: 0.85;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      #hp-bar {
        height: 18px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(0, 0, 0, 0.45);
        border-radius: 6px;
      }
      #hp-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #35d07f, #b9f36b);
        transition:
          width 120ms ease,
          background 120ms ease;
      }
      #damage-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #chat {
        position: absolute;
        left: 18px;
        bottom: 148px;
        width: min(320px, calc(100vw - 36px));
        background: rgba(10, 14, 18, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        padding: 10px;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 280ms ease,
          transform 280ms ease;
      }
      #chat.visible,
      #chat.active {
        opacity: 1;
        transform: translateY(0);
      }
      #chat.active {
        pointer-events: auto;
      }
      #chat-messages {
        max-height: 148px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 13px;
        line-height: 1.3;
      }
      .chat-line {
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.7);
        overflow-wrap: anywhere;
      }
      .chat-line .name {
        font-weight: 700;
      }
      #chat-input {
        display: none;
        width: 100%;
        margin-top: 9px;
        box-sizing: border-box;
        border: 1px solid rgba(102, 204, 255, 0.55);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border-radius: 4px;
        padding: 8px 9px;
        font: 13px monospace;
        outline: none;
      }
      #chat.active #chat-input {
        display: block;
      }
      .damage-number {
        position: absolute;
        color: #ffef8a;
        font-size: 22px;
        font-weight: bold;
        text-shadow:
          0 1px 0 #5b120f,
          0 2px 10px rgba(0, 0, 0, 0.8);
        transform: translate(-50%, -50%);
        opacity: 1;
        white-space: nowrap;
      }
      .damage-number.headshot {
        color: #ff4a4a;
        text-shadow:
          0 1px 0 #fff,
          0 2px 12px rgba(255, 0, 0, 0.9);
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-family: monospace;
        font-size: 16px;
        cursor: pointer;
        pointer-events: auto;
        text-align: center;
        line-height: 1.6;
      }
      #overlay.hidden {
        display: none;
      }
      #overlay .panel {
        background: rgba(20, 28, 36, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 24px 32px;
        border-radius: 8px;
        cursor: default;
      }
      #overlay .panel.clickable {
        cursor: pointer;
      }
      #overlay h1 {
        margin: 0 0 16px;
        font-size: 22px;
        letter-spacing: 2px;
      }
      #overlay input {
        font-family: inherit;
        font-size: 16px;
        padding: 8px 12px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.4);
        color: white;
        width: 220px;
        margin: 4px 0 14px;
      }
      #overlay input:focus {
        outline: none;
        border-color: #6cf;
      }
      #overlay input[aria-invalid='true'] {
        border-color: #ff6b6b;
      }
      #name-error {
        min-height: 18px;
        margin: -8px 0 8px;
        color: #ff8a8a;
        font-size: 12px;
        text-align: center;
      }
      #class-select {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin: 12px 0 16px;
      }
      .class-card {
        width: 96px;
        height: 96px;
        display: grid;
        grid-template-rows: 48px 1fr;
        place-items: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: white;
        border-radius: 8px;
        cursor: pointer;
        transition:
          border-color 140ms ease,
          background 140ms ease,
          transform 140ms ease;
      }
      .class-card:hover,
      .class-card.selected {
        border-color: #6cf;
        background: rgba(102, 204, 255, 0.14);
        transform: translateY(-2px);
      }
      .class-icon {
        position: relative;
        width: 44px;
        height: 44px;
      }
      .class-icon.gi::before {
        content: '';
        position: absolute;
        width: 34px;
        height: 12px;
        left: 4px;
        top: 18px;
        background: #b7c6d8;
        box-shadow:
          21px 0 0 -6px #7d8b9a,
          -2px 13px 0 -4px #55616d;
      }
      .class-icon.gi::after {
        content: '';
        position: absolute;
        width: 26px;
        height: 3px;
        right: 0;
        top: 12px;
        background: #ffc857;
      }
      .class-icon.mage::before {
        content: '';
        position: absolute;
        width: 6px;
        height: 38px;
        left: 19px;
        top: 4px;
        background: #9d6a3a;
        transform: rotate(35deg);
      }
      .class-icon.mage::after {
        content: '';
        position: absolute;
        width: 18px;
        height: 18px;
        right: 5px;
        top: 0;
        border-radius: 50%;
        background: #7be7ff;
        box-shadow: 0 0 14px #7be7ff;
      }
      .class-icon.assassin::before {
        content: '';
        position: absolute;
        width: 12px;
        height: 34px;
        left: 16px;
        top: 3px;
        background: linear-gradient(#f4fbff, #9faab2);
        clip-path: polygon(50% 0, 100% 80%, 50% 100%, 0 80%);
        transform: rotate(42deg);
      }
      .class-icon.assassin::after {
        content: '';
        position: absolute;
        width: 26px;
        height: 7px;
        left: 9px;
        bottom: 6px;
        background: #15171b;
        transform: rotate(42deg);
      }
      #overlay button {
        font-family: inherit;
        font-size: 16px;
        padding: 8px 24px;
        border-radius: 4px;
        border: 0;
        background: #6cf;
        color: #001;
        font-weight: bold;
        cursor: pointer;
      }
      #overlay button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #overlay .join-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      #overlay .icon-button {
        width: 40px;
        height: 40px;
        padding: 0;
        display: inline-grid;
        place-items: center;
      }
      #overlay .icon-button svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
      }
      #overlay .class-card {
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: white;
        font-weight: normal;
      }
      #overlay .class-card:hover,
      #overlay .class-card.selected {
        border-color: #6cf;
        background: rgba(102, 204, 255, 0.14);
      }
      #overlay .help {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="hit-x"></div>
      <div id="hurt-flash"></div>
      <div id="score">
        <span class="me" id="score-me">0</span>
        <span class="sep">—</span>
        <span class="opp" id="score-opp">0</span>
      </div>
      <div id="status">connecting…</div>
      <div id="players">
        <div class="title">Players</div>
        <div id="player-list"></div>
      </div>
      <div id="damage-layer"></div>
      <div id="chat">
        <div id="chat-messages"></div>
        <input id="chat-input" maxlength="120" autocomplete="off" placeholder="All chat" />
      </div>
      <div id="hp-panel">
        <div class="label-row">
          <span>HP</span>
          <span id="hp-text">100/100</span>
        </div>
        <div id="hp-bar"><div id="hp-fill"></div></div>
      </div>
      <div id="ammo">
        <span class="label" id="weapon-label">Ammo</span>
        <span id="ammo-count">--</span>
      </div>
    </div>
    <div id="overlay">
      <div class="panel" id="overlay-panel">
        <div id="name-form">
          <h1>FPS 1v1</h1>
          <div>Enter your name</div>
          <input id="name-input" maxlength="16" autocomplete="off" placeholder="Player" />
          <div id="name-error" role="alert"></div>
          <div id="class-select" aria-label="Choose class">
            <button class="class-card selected" type="button" data-class="gi" title="G.I.">
              <span class="class-icon gi"></span>
              <span>G.I.</span>
            </button>
            <button class="class-card" type="button" data-class="mage" title="Mage">
              <span class="class-icon mage"></span>
              <span>Mage</span>
            </button>
            <button class="class-card" type="button" data-class="assassin" title="Assassin">
              <span class="class-icon assassin"></span>
              <span>Assassin</span>
            </button>
          </div>
          <br />
          <div class="join-actions">
            <button id="join-btn">Join match</button>
            <button
              id="copy-session-btn"
              class="icon-button"
              type="button"
              title="Copy session link"
              aria-label="Copy session link"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1" />
                <path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.1-1.1" />
              </svg>
            </button>
            <button
              id="fullscreen-join-btn"
              class="icon-button"
              type="button"
              title="Join fullscreen"
              aria-label="Join fullscreen"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" aria-hidden="true">
                <path d="M8 3H3v5" />
                <path d="M16 3h5v5" />
                <path d="M8 21H3v-5" />
                <path d="M16 21h5v-5" />
                <path d="M3 3l6 6" />
                <path d="M21 3l-6 6" />
                <path d="M3 21l6-6" />
                <path d="M21 21l-6-6" />
              </svg>
            </button>
          </div>
          <div class="help">
            WASD move &middot; Q/E peek &middot; Shift sprint &middot; Space jump &middot; Ctrl
            crouch &middot; Right click zoom/special &middot; R reload &middot; Shift+Enter chat
          </div>
        </div>
        <div id="play-text" style="display: none">
          Click to play
          <div class="help">
            WASD move &middot; Q/E peek &middot; Right click zoom/special &middot; R reload &middot;
            Shift+Enter chat &middot; ESC release
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
