<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS 1v1</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: white;
        font-family: monospace;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
      }
      #crosshair::before,
      #crosshair::after,
      #hit-x::before,
      #hit-x::after {
        content: '';
        position: absolute;
        background: currentColor;
        left: 50%;
        top: 50%;
        transform-origin: center;
      }
      #crosshair::before {
        width: 18px;
        height: 2px;
        transform: translate(-50%, -50%);
      }
      #crosshair::after {
        width: 2px;
        height: 18px;
        transform: translate(-50%, -50%);
      }
      #hit-x {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        color: #ff4a4a;
        opacity: 0;
        transform: scale(0.7);
        transition:
          opacity 120ms ease,
          transform 120ms ease;
      }
      #hit-x.show {
        opacity: 1;
        transform: scale(1);
      }
      #hit-x::before {
        width: 28px;
        height: 3px;
        transform: translate(-50%, -50%) rotate(45deg);
      }
      #hit-x::after {
        width: 28px;
        height: 3px;
        transform: translate(-50%, -50%) rotate(-45deg);
      }
      #score {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 2px;
        background: rgba(0, 0, 0, 0.4);
        padding: 6px 18px;
        border-radius: 6px;
      }
      #score .me {
        color: #6cf;
      }
      #score .sep {
        opacity: 0.5;
      }
      #score .opp {
        color: #f86;
      }
      #status {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        opacity: 0.7;
      }
      #players {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.6;
        min-width: 140px;
      }
      #players .title {
        opacity: 0.6;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
      }
      #players .row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #players .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      #players .me .dot {
        background: #6cf;
      }
      #players .opp .dot {
        background: #f86;
      }
      #players .you {
        opacity: 0.6;
        font-size: 11px;
        margin-left: 4px;
      }
      #ammo {
        position: absolute;
        right: 22px;
        bottom: 20px;
        min-width: 128px;
        text-align: right;
        font-size: 34px;
        font-weight: bold;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
      }
      #ammo .label {
        display: block;
        font-size: 11px;
        opacity: 0.65;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      #damage-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .damage-number {
        position: absolute;
        color: #ffef8a;
        font-size: 22px;
        font-weight: bold;
        text-shadow:
          0 1px 0 #5b120f,
          0 2px 10px rgba(0, 0, 0, 0.8);
        transform: translate(-50%, -50%);
        opacity: 1;
        white-space: nowrap;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font-family: monospace;
        font-size: 16px;
        cursor: pointer;
        pointer-events: auto;
        text-align: center;
        line-height: 1.6;
      }
      #overlay.hidden {
        display: none;
      }
      #overlay .panel {
        background: rgba(20, 28, 36, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 24px 32px;
        border-radius: 8px;
        cursor: default;
      }
      #overlay .panel.clickable {
        cursor: pointer;
      }
      #overlay h1 {
        margin: 0 0 16px;
        font-size: 22px;
        letter-spacing: 2px;
      }
      #overlay input {
        font-family: inherit;
        font-size: 16px;
        padding: 8px 12px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.4);
        color: white;
        width: 220px;
        margin: 4px 0 14px;
      }
      #overlay input:focus {
        outline: none;
        border-color: #6cf;
      }
      #class-select {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin: 12px 0 16px;
      }
      .class-card {
        width: 96px;
        height: 96px;
        display: grid;
        grid-template-rows: 48px 1fr;
        place-items: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: white;
        border-radius: 8px;
        cursor: pointer;
        transition:
          border-color 140ms ease,
          background 140ms ease,
          transform 140ms ease;
      }
      .class-card:hover,
      .class-card.selected {
        border-color: #6cf;
        background: rgba(102, 204, 255, 0.14);
        transform: translateY(-2px);
      }
      .class-icon {
        position: relative;
        width: 44px;
        height: 44px;
      }
      .class-icon.gi::before {
        content: '';
        position: absolute;
        width: 34px;
        height: 12px;
        left: 4px;
        top: 18px;
        background: #b7c6d8;
        box-shadow:
          21px 0 0 -6px #7d8b9a,
          -2px 13px 0 -4px #55616d;
      }
      .class-icon.gi::after {
        content: '';
        position: absolute;
        width: 26px;
        height: 3px;
        right: 0;
        top: 12px;
        background: #ffc857;
      }
      .class-icon.mage::before {
        content: '';
        position: absolute;
        width: 6px;
        height: 38px;
        left: 19px;
        top: 4px;
        background: #9d6a3a;
        transform: rotate(35deg);
      }
      .class-icon.mage::after {
        content: '';
        position: absolute;
        width: 18px;
        height: 18px;
        right: 5px;
        top: 0;
        border-radius: 50%;
        background: #7be7ff;
        box-shadow: 0 0 14px #7be7ff;
      }
      .class-icon.assassin::before {
        content: '';
        position: absolute;
        width: 12px;
        height: 34px;
        left: 16px;
        top: 3px;
        background: linear-gradient(#f4fbff, #9faab2);
        clip-path: polygon(50% 0, 100% 80%, 50% 100%, 0 80%);
        transform: rotate(42deg);
      }
      .class-icon.assassin::after {
        content: '';
        position: absolute;
        width: 26px;
        height: 7px;
        left: 9px;
        bottom: 6px;
        background: #15171b;
        transform: rotate(42deg);
      }
      #overlay button {
        font-family: inherit;
        font-size: 16px;
        padding: 8px 24px;
        border-radius: 4px;
        border: 0;
        background: #6cf;
        color: #001;
        font-weight: bold;
        cursor: pointer;
      }
      #overlay button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #overlay .help {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="hit-x"></div>
      <div id="score">
        <span class="me" id="score-me">0</span>
        <span class="sep">—</span>
        <span class="opp" id="score-opp">0</span>
      </div>
      <div id="status">connecting…</div>
      <div id="players">
        <div class="title">Players</div>
        <div id="player-list"></div>
      </div>
      <div id="damage-layer"></div>
      <div id="ammo">
        <span class="label">Ammo</span>
        <span id="ammo-count">--</span>
      </div>
    </div>
    <div id="overlay">
      <div class="panel" id="overlay-panel">
        <div id="name-form">
          <h1>FPS 1v1</h1>
          <div>Enter your name</div>
          <input id="name-input" maxlength="16" autocomplete="off" placeholder="Player" />
          <div id="class-select" aria-label="Choose class">
            <button class="class-card selected" type="button" data-class="gi" title="G.I.">
              <span class="class-icon gi"></span>
              <span>G.I.</span>
            </button>
            <button class="class-card" type="button" data-class="mage" title="Mage">
              <span class="class-icon mage"></span>
              <span>Mage</span>
            </button>
            <button class="class-card" type="button" data-class="assassin" title="Assassin">
              <span class="class-icon assassin"></span>
              <span>Assassin</span>
            </button>
          </div>
          <br />
          <button id="join-btn">Join match</button>
          <div class="help">
            WASD move &middot; Shift sprint &middot; Space jump &middot; Ctrl crouch &middot; Mouse
            look
          </div>
        </div>
        <div id="play-text" style="display: none">
          Click to play
          <div class="help">
            WASD move &middot; Shift sprint &middot; Space jump &middot; Ctrl crouch &middot; ESC to
            release
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
